name: NexusIDEGuest
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  NexusCore:
    path: .
targets:
  NexusIDEGuest:
    type: application
    platform: iOS
    sources:
      - App
      - path: RuntimeAssets/fs
        type: folder
        buildPhase: resources
    dependencies:
      - package: NexusCore
        product: NexusCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nexuside.guest
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nexus Linux Lab
        SWIFT_VERSION: '5.0'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NEXUS_EMBEDDED_LINUX"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/RuntimeBridge/include/NexusGuestBridge.h"
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/RuntimeAssets/lib/libnexus_guest_bridge.a -lsqlite3 -lc++ -framework Foundation -framework CoreFoundation -framework Security -framework SystemConfiguration"
        SUPPORTED_PLATFORMS: iphoneos
        ARCHS: arm64
    scheme: {}
