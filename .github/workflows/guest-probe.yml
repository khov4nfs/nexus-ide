            curl --proto '=https' --tlsv1.2 --fail --location --retry 2 "$source/$name" -o "$RUNNER_TEMP/$name"
          done
          pylsp="$RUNNER_TEMP/nexus-pylsp-stage/pylsp-rootfs.tar.gz"
          (cd "$RUNNER_TEMP/nexus-pylsp-stage" && shasum -a 256 -c SHA256SUMS)
          python3 scripts/prepare-workbench-rootfs.py --archive "$asset" --source-license "$RUNNER_TEMP/LICENSE.txt" --source-notices "$RUNNER_TEMP/ThirdPartyNotices.txt" --pylsp-rootfs "$pylsp" --pylsp-rootfs-sha256 "$(shasum -a 256 "$pylsp" | awk '{print $1}')" --confirm-local-use
          mv RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/plain-ubuntu-staged"
          bash scripts/stage-ubuntu-device.sh --workbench
      - name: Prepare pinned CI-only Chromium browser harness
        if: matrix.variant == 'workbench'
        run: |
          python3 -m venv "$RUNNER_TEMP/nexus-browser"
          "$RUNNER_TEMP/nexus-browser/bin/python" -m pip install 'playwright==1.51.0'
          "$RUNNER_TEMP/nexus-browser/bin/python" -m playwright install chromium
      - name: Boot reviewed real OpenVSCode and verify browser editor and extension activation
        id: workbench_gate
        if: matrix.variant == 'workbench'
        timeout-minutes: 14
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-workbench-fs"
          export NEXUS_WORKBENCH_ROOTFS="$RUNNER_TEMP/nexus-workbench-fs/data"
          export NEXUS_WORKBENCH_EVIDENCE="$RUNNER_TEMP/nexus-workbench.json"
          export NEXUS_WORKBENCH_CI_TRACE=1
          export NEXUS_WORKBENCH_BROWSER_PYTHON="$RUNNER_TEMP/nexus-browser/bin/python"
          export NEXUS_WORKBENCH_BROWSER_SCRIPT="$GITHUB_WORKSPACE/scripts/workbench-browser-probe.py"
          python3 scripts/build-test-vsix.py "$RUNNER_TEMP/nexus-fixture.vsix"
          export NEXUS_WORKBENCH_VSIX_SHA="$(shasum -a 256 "$RUNNER_TEMP/nexus-fixture.vsix" | awk '{print $1}')"
          cat "$RUNNER_TEMP/nexus-fixture.vsix" > "$NEXUS_WORKBENCH_ROOTFS/opt/nexus/extension.vsix"
          touch "$RUNNER_TEMP/nexus-workbench-start"
          cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_workbench_loopback -- --ignored --nocapture --test-threads=1
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["ok"] is True and r["ready"] is True and r["httpStatus"] in [200,302,303,307] and r["shutdownClean"] is True and r["nodeRuntimeVerified"] is True and r["extensionDigestVerified"] is True and r["extensionInstallVerified"] is True and r["browserRequested"] is True and r["extensionActivationVerified"] is True and r["editorVerified"] is True and r["lspVerified"] is True and r["lspFixtureOnly"] is True' "$NEXUS_WORKBENCH_EVIDENCE"
      - name: Verify persistent real Workbench Python C and C++ LSP through Chromium
        if: matrix.variant == 'workbench'
        timeout-minutes: 32
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-workbench-real-fs"
          export NEXUS_WORKBENCH_ROOTFS="$RUNNER_TEMP/nexus-workbench-real-fs/data"
          export NEXUS_WORKBENCH_EVIDENCE="$RUNNER_TEMP/nexus-workbench-real-lsp.json"
          export NEXUS_WORKBENCH_REAL_LSP=1
          export NEXUS_WORKBENCH_CI_TRACE=1
          export NEXUS_WORKBENCH_BROWSER_PYTHON="$RUNNER_TEMP/nexus-browser/bin/python"
          export NEXUS_WORKBENCH_BROWSER_SCRIPT="$GITHUB_WORKSPACE/scripts/workbench-browser-probe.py"
          node --check scripts/workbench-real-lsp-extension.js
          node --check scripts/workbench-lsp-session.js
          node --test scripts/test-workbench-lsp-session.js
          python3 scripts/build-real-workbench-vsix.py "$RUNNER_TEMP/nexus-real-pylsp.vsix"
          export NEXUS_WORKBENCH_VSIX_SHA="$(shasum -a 256 "$RUNNER_TEMP/nexus-real-pylsp.vsix" | awk '{print $1}')"
          cat "$RUNNER_TEMP/nexus-real-pylsp.vsix" > "$NEXUS_WORKBENCH_ROOTFS/opt/nexus/extension.vsix"
          cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_workbench_loopback -- --ignored --nocapture --test-threads=1
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert all(r[k] is True for k in ["ok","shutdownClean","extensionActivationVerified","editorVerified","lspVerified","realDiagnosticsVerified","realCompletionVerified"]) and r["lspFixtureOnly"] is False and r["realServerVersion"]=="1.10.0" and r["persistentMultiLanguageVerified"] is True and r["clangdVersion"]=="18.1.3"' "$NEXUS_WORKBENCH_EVIDENCE"
      - name: Collect bounded native crash stack (CI-only)
        if: failure() && matrix.variant == 'workbench' && steps.workbench_gate.outcome == 'failure'
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          root = Path.home() / "Library/Logs/DiagnosticReports"
          tmp = Path(os.environ["RUNNER_TEMP"])
          marker = tmp / "nexus-workbench-start"
          start = marker.stat().st_mtime if marker.exists() else time.time()
          report = {"available": False, "scope": "synthetic Workbench CI only"}
          for attempt in range(12):
              for path in sorted(root.glob("nexus_guest_bridge*.ips"), key=lambda p: p.stat().st_mtime, reverse=True):
                  if path.stat().st_mtime < start or path.stat().st_size > 16 * 1024 * 1024:
                      continue
                  try:
                      raw = path.read_text()
                      decoder = json.JSONDecoder()
                      header, end = decoder.raw_decode(raw.lstrip())
                      payload = decoder.raw_decode(raw.lstrip()[end:].lstrip())[0]
                      if not str(payload.get("procName", "")).startswith("nexus_guest_bridge"):
                          continue
                      threads = payload.get("threads", [])
                      index = payload.get("faultingThread")
                      if not isinstance(index, int) or not 0 <= index < len(threads):
                          continue
                      images = payload.get("usedImages", [])
                      frames = []
                      for frame in threads[index].get("frames", [])[:40]:
                          i = frame.get("imageIndex")
                          image = images[i].get("name", "") if isinstance(i, int) and 0 <= i < len(images) else ""
                          frames.append({"image": str(image)[:120], "symbol": str(frame.get("symbol", ""))[:200],
                                         "offset": frame.get("imageOffset"), "symbolLocation": frame.get("symbolLocation")})
                      report.update(available=True, exceptionType=payload.get("exception", {}).get("type"),
                                    faultingThread=index, frames=frames)
                      break
                  except (OSError, ValueError, TypeError, IndexError, AttributeError):
                      continue
              if report["available"]:
                  break
              time.sleep(2)
          (tmp / "nexus-workbench-crash.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report))
          PY
      - name: Upload Workbench crash diagnostics
        if: failure() && matrix.variant == 'workbench' && steps.workbench_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: workbench-native-crash
          path: ${{ runner.temp }}/nexus-workbench-crash.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload workbench loopback evidence
        if: always() && matrix.variant == 'workbench'
        uses: actions/upload-artifact@v4
        with:
          name: workbench-loopback-evidence${{ github.event_name == 'pull_request' && format('-{0}', matrix.variant) || '' }}
          path: |
            ${{ runner.temp }}/nexus-workbench.json
            ${{ runner.temp }}/nexus-workbench-real-lsp.json
          if-no-files-found: warn
      - name: Download successful full-system regression from this run
        if: github.event_name == 'workflow_dispatch' && inputs.full_vm
        uses: actions/download-artifact@v4
        with:
          name: vm-tci-host-research
          path: ${{ runner.temp }}/full-vm-host
      - name: Cross-compile reviewed full-system backend for final Release
        if: github.event_name == 'workflow_dispatch' && inputs.full_vm
        run: |
          cp "$RUNNER_TEMP/full-vm-host/vm-tci-host-evidence.json" "$RUNNER_TEMP/nexus-full-vm-host.json"
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make cmake spirv-llvm-translator libxcb libxrandr
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix gettext)/bin:$PATH"
          python3 -m venv "$RUNNER_TEMP/nexus-vm-python"
          "$RUNNER_TEMP/nexus-vm-python/bin/python" -m pip install six pyparsing pyyaml setuptools distlib mako
          export PATH="$RUNNER_TEMP/nexus-vm-python/bin:$PATH"
          bash scripts/build-ios-vm.sh
          python3 scripts/verify-full-vm-distribution.py --inventory RuntimeAssets/full-vm/source-inventory.json
          source_url="$(python3 scripts/verify-full-vm-distribution.py --print-source-url)"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --location --max-filesize 2147483648 --max-time 600 "$source_url" -o "$RUNNER_TEMP/vm-corresponding-source"
          python3 scripts/verify-full-vm-distribution.py --inventory RuntimeAssets/full-vm/source-inventory.json --archive "$RUNNER_TEMP/vm-corresponding-source"
      - name: Build and verify integrated Release IPA
        env:
          VARIANT: ${{ matrix.variant }}
          FULL_VM: ${{ inputs.full_vm && 'true' || 'false' }}
        run: |
          vm_flags=""
          if [[ "$FULL_VM" == true ]]; then vm_flags=NEXUS_FULL_VM; fi
          xcodebuild -project NexusIDEUbuntuLab.xcodeproj -scheme NexusIDEUbuntuLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/nexus-integrated" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION=0.8.0 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" NEXUS_VM_SWIFT_FLAGS="$vm_flags" build
          python3 scripts/package-ipa.py --app "$RUNNER_TEMP/nexus-integrated/Build/Products/Release-iphoneos/NexusIDEUbuntuLab.app" --output "$RUNNER_TEMP/nexus-integrated-ipa" --variant "$VARIANT" --commit "$GITHUB_SHA"
      - name: Stage exact tested real-LSP extension for optional reviewed device delivery
        if: matrix.variant == 'workbench'
        run: |
          cp "$RUNNER_TEMP/nexus-real-pylsp.vsix" "$RUNNER_TEMP/nexus-integrated-ipa/nexus-real-pylsp.vsix"
          (cd "$RUNNER_TEMP/nexus-integrated-ipa" && shasum -a 256 nexus-real-pylsp.vsix > WORKBENCH-VSIX-SHA256)
      - name: Bind full VM build scope and distribution record
        env:
          FULL_VM: ${{ inputs.full_vm && 'true' || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          package = root / "nexus-integrated-ipa"
          build = json.loads((package / "build.json").read_text())
          expected = os.environ["FULL_VM"] == "true"
          assert build["fullVMIncluded"] is expected
          if expected:
              review = pathlib.Path("docs/full-vm-distribution-review.json")
              approved = json.loads(review.read_text())
              assert build["fullVMSourceInventorySHA256"] == approved["sourceInventorySHA256"]
              shutil.copyfile(review, package / "full-vm-distribution-review.json")
              (root / "nexus-full-vm-build.json").write_text(json.dumps({
                  "ok": True, "iosBackendCompiled": True, "physicalDeviceVerified": False,
                  "ownerDistributionRecordMatched": True, "commit": build["commit"],
                  "ipaSha256": build["sha256"], "sourceInventorySHA256": build["fullVMSourceInventorySHA256"]
              }, indent=2))
          PY
      - name: Bind completed CI evidence to exact integrated IPA
        env:
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/collect-release-acceptance.py --evidence "$RUNNER_TEMP" --package "$RUNNER_TEMP/nexus-integrated-ipa" --commit "$GITHUB_SHA" --variant "$VARIANT"
      - name: Create untouched device acceptance template bound to exact IPA
        env:
          VARIANT: ${{ matrix.variant }}
        run: python3 scripts/verify-device-acceptance.py --package "$RUNNER_TEMP/nexus-integrated-ipa" --record "$RUNNER_TEMP/nexus-integrated-ipa/device-record-template.json" --initialize --expected-commit "$GITHUB_SHA" --expected-variant "$VARIANT"
      - name: Upload acceptance metadata (no IPA)
        uses: actions/upload-artifact@v4
        with:
          name: NexusIDE-integrated-acceptance${{ github.event_name == 'pull_request' && format('-{0}', matrix.variant) || '' }}
          path: |
            ${{ runner.temp }}/nexus-integrated-ipa/acceptance.json
            ${{ runner.temp }}/nexus-integrated-ipa/build.json
            ${{ runner.temp }}/nexus-integrated-ipa/device-record-template.json
          if-no-files-found: error
      - name: Upload integrated unsigned IPA only after owner license review
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.license_reviewed
        uses: actions/upload-artifact@v4
        with:
          name: NexusIDE-integrated-unsigned${{ github.event_name == 'pull_request' && format('-{0}', matrix.variant) || '' }}
          path: ${{ runner.temp }}/nexus-integrated-ipa/*
          if-no-files-found: error
          retention-days: 14
      - name: Record scope
        run: echo "Unsigned Release IPA verified structurally; no physical device evidence. Linked guest artifact distribution requires owner license review. No AGY binary."
  publish-integrated:
    needs: cross-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.license_reviewed && inputs.publish_prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: NexusIDE-integrated-unsigned
          path: release
      - name: Reverify downloaded IPA, CI scope and untouched device template
        env:
          VARIANT: ${{ inputs.variant }}
          FULL_VM: ${{ inputs.full_vm && 'true' || 'false' }}
        run: |
          python3 scripts/verify-device-acceptance.py --package release --record release/device-record-template.json --verify-release-template --expected-commit "$GITHUB_SHA" --expected-variant "$VARIANT"
          python3 -c 'import json, os; b=json.load(open("release/build.json")); assert b["fullVMIncluded"] is (os.environ["FULL_VM"]=="true")'
          if [[ "$FULL_VM" == true ]]; then
            cmp docs/full-vm-distribution-review.json release/full-vm-distribution-review.json
            python3 scripts/verify-full-vm-distribution.py
          fi
      - name: Publish reviewed test candidate (not production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          extra=()
          if [[ -f nexus-real-pylsp.vsix ]]; then
            sha256sum -c WORKBENCH-VSIX-SHA256
            extra+=(nexus-real-pylsp.vsix WORKBENCH-VSIX-SHA256)
          fi
          if [[ -f full-vm-distribution-review.json ]]; then extra+=(full-vm-distribution-review.json); fi
          gh release create "ios-integrated-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Nexus IDE integrated iPhone test" --notes "Unsigned ARM64 device test candidate. Owner confirmed license review and responsibility for corresponding source and notices. No proprietary AGY bundled. Re-sign using your own legitimate installer. Physical iPhone, workbench runtime and production readiness unverified." *.ipa SHA256SUMS build.json acceptance.json device-record-template.json "${extra[@]}"

