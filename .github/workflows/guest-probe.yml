name: Experimental iOS guest build
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Ubuntu integrated or optional pinned workbench
        type: choice
        options: [ubuntu, workbench]
        default: ubuntu
      license_reviewed:
        description: I have reviewed redistribution rights and will satisfy all source/notice obligations for the public IPA
        type: boolean
        default: false
      publish_prerelease:
        description: Publish test IPA to Releases (main only, requires license review)
        type: boolean
        default: false
  pull_request:
    paths:
      - 'RuntimeBridge/**'
      - 'scripts/build-guest-device.sh'
      - 'scripts/apply-runtime-patches.py'
      - 'scripts/verify-guest-evidence.py'
      - 'scripts/preflight-runtime.py'
      - 'scripts/package-ipa.py'
      - 'scripts/test-package-ipa.py'
      - 'scripts/build-glibc-rootfs.sh'
      - 'scripts/verify-glibc-evidence.py'
      - 'scripts/verify-acp-transport.py'
      - 'Sources/NexusCore/**'
      - 'scripts/prepare-agy-rootfs.py'
      - 'scripts/prepare-workbench-rootfs.py'
      - 'scripts/test-workbench-import.py'
      - 'scripts/test-agy-import.py'
      - 'scripts/stage-ubuntu-device.sh'
      - 'scripts/prepare-swiftterm.sh'
      - 'App/LiveTerminal.swift'
      - 'project-glibc.yml'
      - 'App/UbuntuLabApp.swift'
      - 'App/NexusApp.swift'
      - 'App/LocalToolsView.swift'
      - 'App/GeminiKeychain.swift'
      - 'App/LocalAGYImport.swift'
      - 'project-guest.yml'
      - 'App/GuestProbeView.swift'
      - '.github/workflows/guest-probe.yml'
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source syntax before dependency installation
        run: |
          rustup component add rustfmt
          python3 scripts/preflight-runtime.py
          python3 scripts/test-agy-import.py
          python3 scripts/test-workbench-import.py
          python3 scripts/test-package-ipa.py
      - name: Install guest build dependencies
        run: brew install meson ninja llvm lld libarchive sqlite xcodegen
      - name: Build pinned runtime and rootfs
        run: bash scripts/build-guest-device.sh
      - name: Preserve Meson logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-diagnostics
          path: |
            Vendor/litter-ish/build/**/meson-logs/meson-log.txt
            RuntimeBridge/target/**/meson-logs/meson-log.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Unsigned ARM64 device build
        run: xcodebuild -project NexusIDEGuest.xcodeproj -scheme NexusIDEGuest -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Real guest process, toolchain and workspace tests on macOS build host
        env:
          NEXUS_TEST_PACKAGES: '1'
          NEXUS_TEST_TOOLCHAINS: '1'
          NEXUS_TEST_ROOTFS: ${{ github.workspace }}/Vendor/litter-ish/build/fs/data
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          cargo test --manifest-path RuntimeBridge/Cargo.toml --lib
          export NEXUS_TEST_EVIDENCE="$RUNNER_TEMP/nexus-guest-evidence.json"
          rm -f "$NEXUS_TEST_EVIDENCE"
          cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_guest_process_probe -- --ignored --nocapture --test-threads=1
          python3 scripts/verify-guest-evidence.py "$NEXUS_TEST_EVIDENCE" --toolchains
      - name: Upload completed guest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-probe-evidence
          path: ${{ runner.temp }}/nexus-guest-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build separate Ubuntu ARM64 compatibility rootfs
        run: bash scripts/build-glibc-rootfs.sh
      - name: Unsigned Ubuntu Lab device build (no AGY binary)
        run: |
          bash scripts/stage-ubuntu-device.sh
          xcodebuild -project NexusIDEUbuntuLab.xcodeproj -scheme NexusIDEUbuntuLab -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
      - name: Real glibc compatibility test (separate process)
        env:
          NEXUS_GLIBC_ROOTFS: ${{ github.workspace }}/Vendor/litter-ish/build/ubuntu-fs/data
          NEXUS_GLIBC_EVIDENCE: ${{ runner.temp }}/nexus-glibc-evidence.json
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          rm -f "$NEXUS_GLIBC_EVIDENCE"
          cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_glibc_compatibility -- --ignored --nocapture --test-threads=1
          python3 scripts/verify-glibc-evidence.py "$NEXUS_GLIBC_EVIDENCE"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glibc-compatibility-evidence
          path: ${{ runner.temp }}/nexus-glibc-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Real multi-request ACP transport fixture (not AGY)
        env:
          NEXUS_ACP_ROOTFS: ${{ runner.temp }}/nexus-acp-fs/data
          NEXUS_ACP_EVIDENCE: ${{ runner.temp }}/nexus-acp-evidence.json
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-acp-fs"
          rm -f "$NEXUS_ACP_EVIDENCE"
          # Synthetic credential only; force frame tracing and check redaction before printing.
          log="$RUNNER_TEMP/nexus-acp-trace.log"
          if ! ISH_TRACE_FRAMES=1 cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_persistent_acp_transport -- --ignored --nocapture --test-threads=1 >"$log" 2>&1; then
            echo "Transport fixture failed; raw trace withheld"
            exit 1
          fi
          if grep -q 'NEXUS_TEST_ONLY_NOT_A_REAL_KEY' "$log"; then
            echo "Synthetic credential leaked into trace"
            exit 1
          fi
          cat "$log"
          rm -f "$log"
          python3 scripts/verify-acp-transport.py "$NEXUS_ACP_EVIDENCE"
          # Fresh fakefs and fresh process: preserve the original completion gate.
          cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-acp-cancel-fs"
          export NEXUS_ACP_ROOTFS="$RUNNER_TEMP/nexus-acp-cancel-fs/data"
          export NEXUS_ACP_EVIDENCE="$RUNNER_TEMP/nexus-acp-cancel-evidence.json"
          rm -f "$NEXUS_ACP_EVIDENCE"
          if ! NEXUS_ACP_TEST_CANCEL=1 ISH_TRACE_FRAMES=1 cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_persistent_acp_transport -- --ignored --nocapture --test-threads=1 >"$log" 2>&1; then
            echo "Cancellation fixture failed; raw trace withheld"
            exit 1
          fi
          if grep -q 'NEXUS_TEST_ONLY_NOT_A_REAL_KEY' "$log"; then
            echo "Synthetic credential leaked into cancellation trace"
            exit 1
          fi
          cat "$log"
          rm -f "$log"
          python3 scripts/verify-acp-transport.py "$NEXUS_ACP_EVIDENCE" --cancel
          cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-acp-chat-fs"
          export NEXUS_ACP_ROOTFS="$RUNNER_TEMP/nexus-acp-chat-fs/data"
          export NEXUS_ACP_EVIDENCE="$RUNNER_TEMP/nexus-acp-chat-evidence.json"
          rm -f "$NEXUS_ACP_EVIDENCE"
          if ! NEXUS_ACP_TEST_CHAT=1 ISH_TRACE_FRAMES=1 cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_persistent_acp_transport -- --ignored --nocapture --test-threads=1 >"$log" 2>&1; then
            echo "Chat fixture failed; raw trace withheld"
            exit 1
          fi
          if grep -q 'NEXUS_TEST_ONLY_NOT_A_REAL_KEY' "$log"; then
            echo "Synthetic credential leaked into chat trace"
            exit 1
          fi
          cat "$log"
          rm -f "$log"
          python3 scripts/verify-acp-transport.py "$NEXUS_ACP_EVIDENCE" --chat
      - name: Upload transport fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acp-transport-fixture-evidence
          path: |
            ${{ runner.temp }}/nexus-acp-evidence.json
            ${{ runner.temp }}/nexus-acp-cancel-evidence.json
            ${{ runner.temp }}/nexus-acp-chat-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Real local PTY and MCP discovery fixture
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          for mode in pty mcp call; do
            cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-local-$mode-fs"
            export NEXUS_LOCAL_ROOTFS="$RUNNER_TEMP/nexus-local-$mode-fs/data"
            export NEXUS_LOCAL_EVIDENCE="$RUNNER_TEMP/nexus-local-$mode.json"
            rm -f "$NEXUS_LOCAL_EVIDENCE"
            export NEXUS_LOCAL_MCP=0 NEXUS_LOCAL_CALL=0
            if [ "$mode" = mcp ]; then export NEXUS_LOCAL_MCP=1; fi
            if [ "$mode" = call ]; then export NEXUS_LOCAL_CALL=1; fi
            cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_local_job -- --ignored --nocapture --test-threads=1
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["ok"] is True and r["shutdownClean"] is True; assert (r["ptyVerified"] is True and r["rawPtyVerified"] is True and r["exitCode"] == 0) if sys.argv[2]=="pty" else (r["tools"]==["fixture_echo"] and r["transportClosed"] is True and ((r["discoveryOnly"] is True) if sys.argv[2]=="mcp" else (r["discoveryOnly"] is False and r["calledTool"]=="fixture_echo" and r["text"]=="NEXUS_MCP_42")))' "$NEXUS_LOCAL_EVIDENCE" "$mode"
          done
      - name: Upload local job evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-job-evidence
          path: |
            ${{ runner.temp }}/nexus-local-pty.json
            ${{ runner.temp }}/nexus-local-mcp.json
            ${{ runner.temp }}/nexus-local-call.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify real ELF import slot in fresh Ubuntu guest (not AGY)
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-slot-fs"
          export NEXUS_SLOT_ROOTFS="$RUNNER_TEMP/nexus-slot-fs/data"
          export NEXUS_SLOT_SHA256="$(shasum -a 256 "$NEXUS_SLOT_ROOTFS/usr/bin/true" | awk '{print $1}')"
          export NEXUS_SLOT_EVIDENCE="$RUNNER_TEMP/nexus-slot-evidence.json"
          cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_agy_import_slot -- --ignored --nocapture --test-threads=1
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["ok"] is True and r["digestVerified"] is True and r["exitCode"] == 0 and r["shutdownClean"] is True and r["fixture"] == "Ubuntu true, not AGY"' "$NEXUS_SLOT_EVIDENCE"
      - name: Upload import slot evidence
        uses: actions/upload-artifact@v4
        with:
          name: agy-import-slot-evidence
          path: ${{ runner.temp }}/nexus-slot-evidence.json
          if-no-files-found: error
      - name: Official-login transport fixture (no Google account or AGY)
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-google-fs"
          export NEXUS_GOOGLE_ROOTFS="$RUNNER_TEMP/nexus-google-fs/data"
          export NEXUS_GOOGLE_EVIDENCE="$RUNNER_TEMP/nexus-google.json"
          ISH_TRACE_FRAMES=1 cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_google_login_transport -- --ignored --nocapture --test-threads=1 >"$RUNNER_TEMP/nexus-google-log" 2>&1 || { echo "Login fixture failed; raw log withheld"; exit 1; }
          if grep -q NEXUS_FIXTURE_AUTH_CODE "$RUNNER_TEMP/nexus-google-log"; then echo "Fixture code leaked"; exit 1; fi
          cat "$RUNNER_TEMP/nexus-google-log"
          rm "$RUNNER_TEMP/nexus-google-log"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert all(r[k] is True for k in ["ok","fixtureOnly","browserOffer","sameGuestSession","promptVerified","shutdownClean"])' "$NEXUS_GOOGLE_EVIDENCE"
      - name: Upload Google login fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: google-login-fixture-evidence
          path: ${{ runner.temp }}/nexus-google.json
          if-no-files-found: error
      - name: Verify persisted guest across independent runtime processes
        run: |
          export PATH="$(brew --prefix lld)/bin:$PATH"
          export LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export CC="$(xcrun --sdk macosx --find clang)"
          cp -a RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/nexus-persist-fs"
          export NEXUS_PERSIST_ROOTFS="$RUNNER_TEMP/nexus-persist-fs/data"
          for phase in write read scroll; do
            export NEXUS_PERSIST_PHASE="$phase"
            export NEXUS_PERSIST_EVIDENCE="$RUNNER_TEMP/nexus-persist-$phase.json"
            cargo test --manifest-path RuntimeBridge/Cargo.toml --lib real_persistent_local_guest -- --ignored --nocapture --test-threads=1
            python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["ok"] is True and r["verified"] is True and r["shutdownClean"] is True and r["exitCode"] == 0' "$NEXUS_PERSIST_EVIDENCE"
          done
      - name: Upload persistent guest evidence
        uses: actions/upload-artifact@v4
        with:
          name: persistent-local-guest-evidence
          path: ${{ runner.temp }}/nexus-persist-*.json
          if-no-files-found: error
      - name: Optional reviewed workbench asset for device test
        if: github.event_name == 'workflow_dispatch' && inputs.variant == 'workbench'
        run: |
          asset="$RUNNER_TEMP/openvscode-server-v1.109.5-linux-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 2 https://github.com/gitpod-io/openvscode-server/releases/download/openvscode-server-v1.109.5/openvscode-server-v1.109.5-linux-arm64.tar.gz -o "$asset"
          python3 scripts/prepare-workbench-rootfs.py --archive "$asset" --confirm-local-use
          mv RuntimeAssets/ubuntu-fs "$RUNNER_TEMP/plain-ubuntu-staged"
          bash scripts/stage-ubuntu-device.sh --workbench
      - name: Build and verify integrated Release IPA
        env:
          VARIANT: ${{ inputs.variant || 'ubuntu' }}
        run: |
          xcodebuild -project NexusIDEUbuntuLab.xcodeproj -scheme NexusIDEUbuntuLab -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/nexus-integrated" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" MARKETING_VERSION=0.5.2 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          python3 scripts/package-ipa.py --app "$RUNNER_TEMP/nexus-integrated/Build/Products/Release-iphoneos/NexusIDEUbuntuLab.app" --output "$RUNNER_TEMP/nexus-integrated-ipa" --variant "$VARIANT" --commit "$GITHUB_SHA"
      - name: Upload integrated unsigned IPA only after owner license review
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.license_reviewed
        uses: actions/upload-artifact@v4
        with:
          name: NexusIDE-integrated-unsigned
          path: ${{ runner.temp }}/nexus-integrated-ipa/*
          if-no-files-found: error
          retention-days: 14
      - name: Record scope
        run: echo "Unsigned Release IPA verified structurally; no physical device evidence. Linked guest artifact distribution requires owner license review. No AGY binary."
  publish-integrated:
    needs: cross-build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.license_reviewed && inputs.publish_prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NexusIDE-integrated-unsigned
          path: release
      - name: Publish reviewed test candidate (not production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release create "ios-integrated-test-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Nexus IDE integrated iPhone test" --notes "Unsigned ARM64 device test candidate. Owner confirmed license review and responsibility for corresponding source and notices. No proprietary AGY bundled. Re-sign using your own legitimate installer. Physical iPhone, workbench runtime and production readiness unverified." *.ipa SHA256SUMS build.json

